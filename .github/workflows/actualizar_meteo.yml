name: Actualizar SIGA San Pedro y ECMWF ENS

on:
  schedule:
    # 07:30 y 15:30 hora Argentina (UTC-3)
    - cron: "30 10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-meteo-san-pedro-twin
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.31,<3" "pandas>=2.1,<3" "numpy>=1.26,<3" "xlrd>=2.0.1,<3" "openpyxl>=3.1,<4"

      - name: Verificar sintaxis
        run: |
          python -m py_compile actualizar_meteo_san_pedro.py
          python -m py_compile actualizar_meteo_san_pedro_robusto.py
          python -m py_compile postprocesar_prec_p50_san_pedro.py

      - name: Actualizar SIGA, puente provisional y ECMWF ENS
        env:
          LATITUD: "-33.7328"
          LONGITUD: "-59.7965"
          SIGA_DOWNLOAD_URL: "https://siga.inta.gob.ar/document/series/A872890.xls"
          SIGA_METHOD: GET
          SIGA_LOCAL_FILE: A872890.xls
          SIGA_PARAMS_JSON: ${{ secrets.SIGA_PARAMS_JSON }}
          SIGA_POST_DATA_JSON: ${{ secrets.SIGA_POST_DATA_JSON }}
          SIGA_HEADERS_JSON: ${{ secrets.SIGA_HEADERS_JSON }}
        run: python actualizar_meteo_san_pedro_robusto.py

      - name: Validar serie meteorológica operativa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from actualizar_meteo_san_pedro import CAMPANIA_END

          archivo = Path("meteo_daily.csv")
          estado_path = Path("data/estado_actualizacion_meteo.json")
          if not archivo.exists() or not estado_path.exists():
              raise SystemExit("No se generaron los archivos meteorológicos esperados.")

          df = pd.read_csv(archivo)
          requeridas = {
              "Fecha", "TMAX", "TMIN", "Prec", "TMEDIA",
              "TMAX_Media_Ens", "TMIN_Media_Ens", "TMEDIA_Media_Ens", "Prec_Media_Ens",
              "TMAX_P50", "TMIN_P50", "TMEDIA_P50", "Prec_P50",
              "Fuente", "TipoDato", "CalidadDato", "N_miembros",
          }
          faltantes = requeridas.difference(df.columns)
          if faltantes:
              raise SystemExit(f"Faltan columnas: {sorted(faltantes)}")

          df["Fecha"] = pd.to_datetime(df["Fecha"], errors="coerce")
          if df["Fecha"].isna().any() or df["Fecha"].duplicated().any():
              raise SystemExit("Hay fechas inválidas o duplicadas.")

          criticas = df[["TMAX", "TMIN", "Prec", "TMEDIA"]].apply(
              pd.to_numeric, errors="coerce"
          )
          if criticas.isna().any().any():
              raise SystemExit("Hay datos meteorológicos críticos nulos.")
          if (criticas["TMAX"] < criticas["TMIN"]).any() or (criticas["Prec"] < 0).any():
              raise SystemExit("Hay datos meteorológicos físicamente inválidos.")

          esperadas = pd.date_range(df["Fecha"].min(), df["Fecha"].max(), freq="D")
          if len(esperadas.difference(pd.DatetimeIndex(df["Fecha"]))):
              raise SystemExit("La serie no es diaria y continua.")

          tipos_validos = {"Observado", "Provisional", "Pronostico"}
          desconocidos = set(df["TipoDato"].dropna().astype(str)) - tipos_validos
          if desconocidos:
              raise SystemExit(f"Tipos de dato desconocidos: {sorted(desconocidos)}")

          hoy = pd.Timestamp.now(
              tz="America/Argentina/Buenos_Aires"
          ).normalize().tz_localize(None)
          obs = df["TipoDato"].astype(str).eq("Observado")
          prov = df["TipoDato"].astype(str).eq("Provisional")
          pron = df["TipoDato"].astype(str).eq("Pronostico")
          if (df["Fecha"].dt.date > CAMPANIA_END).any():
              raise SystemExit("Hay fechas posteriores al 1 de octubre de 2026.")
          if not pron.any() and hoy.date() <= CAMPANIA_END:
              raise SystemExit("No hay filas de pronóstico.")
          if (df.loc[obs | prov, "Fecha"] >= hoy).any() or (df.loc[pron, "Fecha"] < hoy).any():
              raise SystemExit("Hay filas ubicadas en un tramo temporal incorrecto.")

          for operativo, p50 in (
              ("TMAX", "TMAX_P50"),
              ("TMIN", "TMIN_P50"),
              ("TMEDIA", "TMEDIA_P50"),
              ("Prec", "Prec_P50"),
          ):
              a = pd.to_numeric(df.loc[pron, operativo], errors="coerce")
              b = pd.to_numeric(df.loc[pron, p50], errors="coerce")
              if not np.allclose(a, b, atol=1e-9, equal_nan=False):
                  raise SystemExit(f"{operativo} no coincide con {p50}.")

          miembros = pd.to_numeric(df.loc[pron, "N_miembros"], errors="coerce")
          if miembros.isna().any() or (miembros < 30).any():
              raise SystemExit("El pronóstico tiene menos de 30 miembros válidos.")

          estado = json.loads(estado_path.read_text(encoding="utf-8"))
          if estado.get("estadistico_operativo") != "P50" or estado.get("huecos_finales"):
              raise SystemExit("El estado meteorológico final no es válido.")
          fechas_prov = set(df.loc[prov, "Fecha"].dt.strftime("%Y-%m-%d"))
          if fechas_prov != set(estado.get("huecos_siga", [])):
              raise SystemExit("Las filas provisionales no coinciden con los huecos SIGA.")

          print(df.groupby(["Fuente", "TipoDato", "CalidadDato"], dropna=False).size())
          print(df.tail(12).to_string(index=False))
          print(json.dumps(estado, ensure_ascii=False, indent=2))
          PY

      - name: Guardar archivos actualizados
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMPDIR_GENERADO="$(mktemp -d)"
          mkdir -p "$TMPDIR_GENERADO/data/historico_pronosticos"
          [ -f meteo_daily.csv ] && cp meteo_daily.csv "$TMPDIR_GENERADO/meteo_daily.csv"
          for archivo in data/estado_actualizacion_meteo.json data/siga_san_pedro_observado.csv; do
            if [ -f "$archivo" ]; then
              mkdir -p "$TMPDIR_GENERADO/$(dirname "$archivo")"
              cp "$archivo" "$TMPDIR_GENERADO/$archivo"
            fi
          done
          [ -d data/historico_pronosticos ] && cp -a data/historico_pronosticos/. "$TMPDIR_GENERADO/data/historico_pronosticos/" || true

          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/historico_pronosticos
          [ -f "$TMPDIR_GENERADO/meteo_daily.csv" ] && cp "$TMPDIR_GENERADO/meteo_daily.csv" meteo_daily.csv
          for archivo in data/estado_actualizacion_meteo.json data/siga_san_pedro_observado.csv; do
            if [ -f "$TMPDIR_GENERADO/$archivo" ]; then
              mkdir -p "$(dirname "$archivo")"
              cp "$TMPDIR_GENERADO/$archivo" "$archivo"
            fi
          done
          [ -d "$TMPDIR_GENERADO/data/historico_pronosticos" ] && cp -a "$TMPDIR_GENERADO/data/historico_pronosticos/." data/historico_pronosticos/ || true

          git add meteo_daily.csv data/estado_actualizacion_meteo.json data/siga_san_pedro_observado.csv
          if [ -d data/historico_pronosticos ]; then
            git add data/historico_pronosticos
          fi
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "Actualiza SIGA San Pedro y ECMWF ENS P50"
          git push origin HEAD:main
